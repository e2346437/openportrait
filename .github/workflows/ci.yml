name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "**/*.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/image.yml"
      - ".github/workflows/security.yml"
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node scripts/check-version.mjs
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    name: Image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: openportrait:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run with Unraid settings (99:100) and check it answers
        run: |
          mkdir -p data/{config,galleries,incoming,cache}
          docker run -d --name op -p 8080:8080 -e PUID=99 -e PGID=100 -e OPENPORTRAIT_PLATFORM=unraid \
            -v "$PWD/data/config:/config" -v "$PWD/data/galleries:/galleries" \
            -v "$PWD/data/incoming:/incoming" -v "$PWD/data/cache:/cache" openportrait:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/health && break; sleep 1; done
          curl -fsS localhost:8080/api/health
          curl -fsS -o /dev/null localhost:8080/studio
          docker exec op cloudflared --version
          docker exec op openportrait | grep -q reset-password
          test "$(stat -c %u:%g data/config/openportrait.db)" = "99:100"
      - name: Logs
        if: always()
        run: docker logs op || true

