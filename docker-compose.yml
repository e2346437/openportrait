# OpenPortrait with plain Docker. See docs/install-docker.md.
#   docker compose up -d
# then open http://<this-machine>:8080 and follow the setup screen.
services:
  openportrait:
    image: ghcr.io/e2346437/openportrait:latest
    container_name: openportrait
    restart: unless-stopped
    # Hardened by default: no extra privileges, a read-only root filesystem, and only the four capabilities the
    # start-up script needs to hand files to your user. See security/DOCKER_HARDENING.md.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, FOWNER]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    pids_limit: 512
    ports:
      - "8080:8080"
      # Camera upload (see docs/camera-upload.md). Nothing listens until you open the upload server in
      # Settings > Camera upload. Publish only what you use; plain FTP belongs on your home network only.
      - "2222:2222"                  # SFTP
      - "2121:2121"                  # FTP / FTPS
      - "30000-30009:30000-30009"    # FTP / FTPS passive data ports
    environment:
      # Run as your own user so files on your shares get the right owner (`id -u`, `id -g`).
      PUID: "1000"
      PGID: "1000"
      UMASK: "022"
      TZ: "America/New_York"
      # Optional: the token for the built-in Cloudflare Tunnel. You can paste it in
      # Settings > Internet access instead, which stores it encrypted.
      CLOUDFLARE_TUNNEL_TOKEN: ""
      # Optional: this server's address on your home network, with the mapped port. Tethering and camera
      # upload show it, because a container can't see its host's address. Can also be set in Settings.
      LAN_URL: ""
      # Optional: a fixed code for the first-run setup screen. Left empty, a random one is printed to the container log.
      SETUP_CODE: ""
      # Optional: addresses allowed to tell the app a visitor's real IP (cloudflared in a separate container).
      TRUSTED_PROXIES: ""
      # Optional: your public address. Filled in from the tunnel when left empty.
      APP_URL: ""
    volumes:
      - ./appdata:/config            # database, keys, backups
      - ./galleries:/galleries       # shoot folders and delivered photos
      - ./incoming:/incoming         # camera uploads waiting to be sorted
      - ./appdata/cache:/cache       # generated previews (safe to delete)
