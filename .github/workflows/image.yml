name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "**/*.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/image.yml"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-version.mjs "$GITHUB_REF_NAME"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Until 1.0, "latest" follows main so the compose file and Unraid template work.
            # At 1.0, switch it to tags only and keep "edge" for main.
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,format=short
      - id: stamp
        run: echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.built }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
