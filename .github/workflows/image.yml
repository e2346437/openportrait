name: Publish image

on:
  pull_request:
    paths:
      - ".github/workflows/image.yml"
      - "security/**"
      - "Dockerfile"
  workflow_dispatch:
    inputs:
      promote:
        description: "Publish the verified candidate to GHCR"
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build and verify release candidate
    runs-on: ubuntu-latest
    outputs:
      archive-sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the release ref
        if: github.event_name == 'workflow_dispatch'
        env:
          PROMOTE: ${{ inputs.promote }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node scripts/check-version.mjs "$GITHUB_REF_NAME"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          elif [[ "$PROMOTE" == true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Promotion requires main or a version tag from main." >&2
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/*" build
      - run: node --test security/tests/gate.test.mjs
      - run: pnpm --filter @openportrait/server exec vitest run test/security test/mfa.test.ts test/extensions.test.ts
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Build one immutable multi-platform candidate
        env:
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version=edge
          if [[ "$RELEASE" == true ]]; then version="$GITHUB_REF_NAME"; fi
          docker buildx build --platform linux/amd64,linux/arm64 \
            --provenance=false --sbom=false --output "type=oci,dest=$RUNNER_TEMP/candidate.tar" \
            --build-arg "VERSION=$version" --build-arg "COMMIT=$GITHUB_SHA" \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" .
      - name: Verify both platform images
        run: |
          for arch in amd64 arm64; do
            export IMAGE="openportrait:candidate-$arch"
            export OUT="security/reports/$arch"
            mkdir -p "$OUT"
            skopeo --override-os linux --override-arch "$arch" copy \
              "oci-archive:$RUNNER_TEMP/candidate.tar" "docker-daemon:$IMAGE"
            security/scripts/scan.sh
            security/scripts/run-local.sh
            security/scripts/zap.sh
            SECURITY_REPORTS_DIR="$OUT" node security/scripts/gate.mjs --enforce
          done
      - id: hash
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/candidate.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch' && inputs.promote
        with:
          name: verified-image-candidate
          path: ${{ runner.temp }}/candidate.tar
          if-no-files-found: error
          retention-days: 1

  promote:
    name: Promote verified image
    if: github.event_name == 'workflow_dispatch' && inputs.promote
    needs: candidate
    runs-on: ubuntu-latest
    environment: image-promotion
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-image-candidate
          path: ${{ runner.temp }}/verified
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Publish the tested manifest and layers without rebuilding
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA256: ${{ needs.candidate.outputs.archive-sha256 }}
        run: |
          cd "$RUNNER_TEMP/verified"
          echo "$EXPECTED_SHA256  candidate.tar" | sha256sum --check
          printf '%s' "$GHCR_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          source_image="oci-archive:$PWD/candidate.tar"
          manifest_sha="$(skopeo inspect --raw "$source_image" | sha256sum | cut -d' ' -f1)"
          case "$GITHUB_REF" in
            refs/heads/main) tags=(latest edge) ;;
            refs/tags/v*)
              version="${GITHUB_REF_NAME#v}"
              tags=("$version")
              if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then tags+=("${version%.*}"); fi
              ;;
            *) exit 1 ;;
          esac
          tags+=("sha-${GITHUB_SHA:0:7}")
          for tag in "${tags[@]}"; do
            destination="docker://ghcr.io/${GITHUB_REPOSITORY,,}:$tag"
            skopeo copy --all --preserve-digests "$source_image" "$destination"
            published="$(skopeo inspect --raw "$destination" | sha256sum | cut -d' ' -f1)"
            test "$published" = "$manifest_sha"
          done
