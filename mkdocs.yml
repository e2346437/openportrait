site_name: OpenPortrait docs
site_url: https://docs.openportrait.app/
site_description: Install, set up and run OpenPortrait, the self-hosted studio CRM for photographers.
repo_url: https://github.com/e2346437/openportrait
repo_name: e2346437/openportrait
edit_uri: edit/main/docs/
docs_dir: docs
use_directory_urls: true
exclude_docs: |
  releasing.md
  brand/README.md
theme:
  name: material
  logo: brand/openportrait-mark-dark.svg
  favicon: brand/favicon.svg
  font:
    text: Hanken Grotesk
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.action.edit
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/brand.css

nav:
  - Home: index.md
  - Getting started:
      - Start here, choose your setup: start-here.md
      - Install with Docker, Compose or Unraid: install-docker.md
      - Internet access with Cloudflare Tunnel: cloudflare-tunnel.md
      - Importing your data: import.md
  - Running your studio:
      - The Home screen: home.md
      - Email, inquiry form and booking pages: booking.md
      - Questionnaires: questionnaires.md
      - Contracts and e-signatures: contracts.md
      - Quotes, invoices and coupons: orders.md
      - Group days: group-days.md
      - Gallery expiry and archive: gallery-expiry.md
      - Client galleries, step by step: galleries-guide.md
      - Galleries design notes: GALLERIES.md
      - Tasks: tasks.md
      - Households: households.md
      - Google Calendar: google-calendar.md
  - Photos and tethering:
      - Camera upload: camera-upload.md
      - Camera upload away from home: camera-upload-wireguard.md
      - Tethering: tethering.md
  - Website and AI:
      - Website builder: website.md
      - Connect your AI: ai-access.md
      - A starter prompt for your AI: ai-prompt.md
  - Developers:
      - Extensions: extensions.md
      - The Extensions page: extensions-page.md
  - Reference:
      - Light and dark appearance: appearance.md
      - Accessibility: accessibility.md
      - Product spec and architecture: SPEC.md
