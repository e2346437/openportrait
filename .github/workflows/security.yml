name: Security

# Runs without any production credentials: synthetic data, throwaway containers, no secrets. See security/TESTING_GUIDE.md.
# Pull requests run the regression and static checks. The image scan, live suite and ZAP run on pushes to main,
# releases, the weekly schedule and manual runs, so each PR does not pay for a full image build. A release (or a
# manual run with "enforce" ticked) blocks on the criteria in security/RELEASE_CHECKLIST.md.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "**/*.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/image.yml"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "17 5 * * 1"   # weekly, so new CVEs in an unchanged tree still show up
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      enforce:
        description: "Fail the run when the release gate blocks"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Authorization, MCP, upload and isolation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/*" build
      - name: Security regression suite (open findings are expected failures until fixed)
        run: pnpm --filter @openportrait/server exec vitest run test/security
      - name: Full-strict run, for the record (shows what is still open)
        continue-on-error: true
        env:
          SECURITY_STRICT: "1"
        run: pnpm --filter @openportrait/server exec vitest run test/security

  static:
    name: Secrets, dependencies, source analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.* 
      - name: Scan
        run: security/scripts/scan.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-reports
          path: security/reports/
          retention-days: 30

  image-and-live:
    name: Image scan, live suite, isolation, authenticated ZAP
    runs-on: ubuntu-latest
    needs: [regression]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Build the image
        run: docker build -t openportrait:security .
      - name: Scan the image (exported as a tarball; no Docker socket is given to the scanner)
        run: IMAGE=openportrait:security security/scripts/scan.sh
      - name: Live suite and two-deployment isolation
        run: IMAGE=openportrait:security security/scripts/run-local.sh
      - name: Authenticated ZAP scan
        run: IMAGE=openportrait:security security/scripts/zap.sh
      - name: Summary and release gate
        if: always()
        run: |
          node security/scripts/report.mjs
          cat security/reports/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          ENFORCE=""
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ inputs.enforce }}" = "true" ]; then ENFORCE="--enforce"; fi
          node security/scripts/gate.mjs $ENFORCE | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: security/reports/
          retention-days: 30
